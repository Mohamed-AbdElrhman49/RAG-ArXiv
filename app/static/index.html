<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv RAG</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 16px;line-height:1.55}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;padding:10px;font-size:1rem}
  button{padding:10px 16px;font-size:1rem;cursor:pointer}
  #answer{white-space:pre-wrap;margin-top:1.2rem}
  .src{border-left:3px solid #888;padding:4px 10px;margin:8px 0;font-size:.9rem}
  .meta{color:#666;font-size:.85rem}
  .warn{color:#b45309}
</style>
</head>
<body>
<h1>arXiv RAG</h1>
<p class="meta">Hybrid search + reranking + cited answers over arXiv papers on RAG.</p>
<form id="f">
  <input type="text" id="q" placeholder="Ask a question…" required minlength="3">
  <button>Ask</button>
</form>
<div id="answer"></div>
<div id="flags" class="meta"></div>
<div id="sources"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("answer").textContent = "…"; $("flags").textContent = ""; $("sources").innerHTML = "";
  const res = await fetch("/query/stream", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({question: $("q").value})});
  if (!res.ok) { $("answer").textContent = "Error " + res.status; return; }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (block.match(/^event: (.*)$/m) || [])[1];
      const data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "{}");
      if (ev === "token") { text += data.text; $("answer").textContent = text; }
      else if (ev === "error") { $("answer").textContent = "Error: " + data.detail; }
      else if (ev === "done") {
        const l = data.latency;
        let flags = `retrieval ${l.retrieval}s · generation ${l.generation}s`;
        if (data.uncited) flags += ' · <span class="warn">answer has no citation</span>';
        if (data.invalid_citations.length) flags += ' · <span class="warn">invalid citations: ' + data.invalid_citations.join(", ") + '</span>';
        $("flags").innerHTML = flags;
        $("sources").innerHTML = "<h3>Sources</h3>" + data.retrieved.map(s =>
          `<div class="src"><b>[${s.n}]</b> <a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>
           <span class="meta"> · p.${s.page}${s.section ? " · " + esc(s.section) : ""}</span><br>${esc(s.snippet)}…</div>`).join("");
      }
    }
  }
});
</script>
</body>
</html>
